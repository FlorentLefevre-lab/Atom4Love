# --- JVM du daemon Gradle ---
# Le Titan 18 HX a largement la RAM pour ces valeurs.
# Réduire à 4g si tu compiles sur une machine plus modeste.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# --- Performance de build ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true

# --- KSP ---
ksp.incremental=true

# KSP enregistre ses sources générées via kotlin.sourceSets, ce que le Kotlin
# intégré à AGP 9 refuse par défaut. Contournement documenté par Google :
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

# --- Désactive la génération de BuildConfig pour les modules qui n'en ont pas besoin ---
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
