[versions]
# --- Build tooling ---
# AGP 9.x / Gradle 9.5 : conservés depuis la configuration existante.
# files/ proposait AGP 8.13.0, incompatible avec le wrapper Gradle 9.5.
agp = "9.3.1"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.2"

# --- AndroidX socle ---
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
navigationCompose = "2.9.5"
datastore = "1.1.7"
securityCrypto = "1.1.0"
workManager = "2.10.5"

# --- Compose ---
composeBom = "2026.02.01"
# material3-adaptive a son propre cycle : le BOM Compose ne le pilote pas.
# 1.3.0 exigerait compileSdk 37 ; on reste en 36 tant que rien ne le réclame.
material3Adaptive = "1.2.0"

# --- Injection de dépendances ---
# files/ demandait 2.57, dont le plugin Gradle utilise BaseExtension,
# API supprimée en AGP 9 (« Android BaseExtension not found »).
hilt = "2.60.1"
hiltNavigationCompose = "1.3.0"
hiltWork = "1.3.0"

# --- Persistance ---
room = "2.8.4"

# --- Réseau / sérialisation ---
okhttp = "5.1.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.7.1"

# --- Cryptographie NOSTR ---
secp256k1 = "0.18.0"

# --- Géographie hexagonale ---
# files/ demandait 4.1.1, mais com.uber:h3-android n'est publié
# qu'à partir de 4.3.2 (4.1.1 n'existe que pour le com.uber:h3 générique).
h3 = "4.4.0"

# --- Localisation ---
playServicesLocation = "21.3.0"

# --- Images ---
coil = "3.3.0"

# --- Vidéo (pièces jointes de la cabine) ---
media3 = "1.11.0"

# --- Tests ---
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
mockk = "1.14.2"
turbine = "1.2.1"

[libraries]
# --- AndroidX socle ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# --- Compose (versions pilotées par le BOM) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Mises en page adaptatives (tablette, pliables) ---
# `adaptive` porte la mesure des fenêtres, `adaptive-layout` les échafaudages
# à deux volets, `adaptive-navigation` le retour arrière entre volets.
androidx-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
androidx-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }

# --- Hilt ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

# --- Room ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Réseau / sérialisation ---
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# --- Crypto NOSTR (secp256k1 / Schnorr BIP-340) ---
secp256k1-kmp = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp", version.ref = "secp256k1" }
secp256k1-kmp-jni-android = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-android", version.ref = "secp256k1" }
# Variante JVM de la lib native : uniquement pour les tests unitaires hors appareil.
secp256k1-kmp-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1" }

# --- Géographie hexagonale (pavage icosaédrique H3) ---
h3-android = { group = "com.uber", name = "h3-android", version.ref = "h3" }
# Variante desktop (natives extraites du classpath) : tests JVM uniquement —
# valide les constantes des portails Goldberg contre la vraie grille H3.
h3-jvm = { group = "com.uber", name = "h3", version = "4.1.1" }

# --- Localisation ---
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# --- Images ---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Vidéo ---
# Pas de `media3-transformer` ici, et c'est une décision : la vidéo part telle
# qu'elle a été filmée, jamais ré-encodée. Ce qui la rend possible n'est pas la
# compression mais le médium — le Wi-Fi seul y a droit (cf. CabinChat).
# Restent la lecture dans la bulle et sa surface Compose.
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

# --- Tests ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
]
room = ["androidx-room-runtime", "androidx-room-ktx"]
okhttp = ["okhttp", "okhttp-logging"]
coil = ["coil-compose", "coil-network-okhttp"]
adaptive = ["androidx-adaptive", "androidx-adaptive-layout", "androidx-adaptive-navigation"]
media3 = ["media3-exoplayer", "media3-ui-compose"]
