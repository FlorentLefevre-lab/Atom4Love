<svg viewBox="-4 -4 764 84" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,sans-serif"><defs><marker id="arr-kin" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
                                <polygon points="0 0,6 3,0 6" fill="#00c968" fill-opacity="0.7"/></marker></defs>
            <!-- Axe fréquences -->
            <line x1="20" y1="55" x2="740" y2="55" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
            <!-- Ticks et labels Hz (400, 420, 429.62, 440, 462.79, 480) -->
            <g fill="#ffffff" fill-opacity="0.28" font-size="8" font-family="sans-serif" text-anchor="middle">
                <line x1="80"  y1="53" x2="80"  y2="57" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/><text x="80" y="67">400 Hz</text>
                <line x1="200" y1="53" x2="200" y2="57" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/><text x="200" y="67">420</text>
                <line x1="380" y1="53" x2="380" y2="57" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/><text x="380" y="67">440</text>
                <line x1="560" y1="53" x2="560" y2="57" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/><text x="560" y="67">460</text>
                <line x1="680" y1="53" x2="680" y2="57" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/><text x="680" y="67">480</text>
            </g>
            <!-- Pic 429.62 Hz (oreille gauche = bleu) -->
            <line x1="263" y1="55" x2="263" y2="8" stroke="#00b4ff" stroke-opacity="0.7" stroke-width="2.5"/>
            <ellipse cx="263" cy="8" rx="10" ry="5" fill="#00b4ff" fill-opacity="0.35" stroke="#00b4ff" stroke-opacity="0.8" stroke-width="1"/>
            <text x="263" y="6" text-anchor="middle" fill="#00b4ff" fill-opacity="0.85" font-size="7.5" font-family="sans-serif" font-weight="bold">429,62 Hz ← G</text>
            <!-- Pic 462.79 Hz (oreille droite = or) -->
            <line x1="593" y1="55" x2="593" y2="14" stroke="#ffd700" stroke-opacity="0.7" stroke-width="2.5"/>
            <ellipse cx="593" cy="14" rx="10" ry="5" fill="#ffd700" fill-opacity="0.28" stroke="#ffd700" stroke-opacity="0.75" stroke-width="1"/>
            <text x="593" y="12" text-anchor="middle" fill="#ffd700" fill-opacity="0.85" font-size="7.5" font-family="sans-serif" font-weight="bold">462,79 Hz → D</text>
            <!-- Flèche beat binaural -->
            <path d="M270 38 Q428 20 586 38" fill="none" stroke="#00ccff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-kin)"/>
            <text x="428" y="28" text-anchor="middle" fill="#00ccff" fill-opacity="0.7" font-size="8.5" font-family="sans-serif" font-weight="bold">Δ = 33,17 Hz (F_Φ)</text>
            <text x="428" y="38" text-anchor="middle" fill="#00ccff" fill-opacity="0.4" font-size="7.5" font-family="sans-serif">battement binaural → ondes γ cérébrales</text>
            <!-- Label Cabine-33 -->
            <text x="700" y="38" text-anchor="middle" fill="#00c968" fill-opacity="0.5" font-size="7.5" font-family="sans-serif" font-weight="bold">≡ Rituel</text>
            <text x="700" y="48" text-anchor="middle" fill="#00c968" fill-opacity="0.35" font-size="7" font-family="sans-serif">Cabine-33</text>
        </svg>